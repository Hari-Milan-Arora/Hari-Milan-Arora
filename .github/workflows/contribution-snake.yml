name: Generate contribution snake

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: contribution-snake
  cancel-in-progress: true

jobs:
  generate:
    name: Build and publish contribution snake
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate light and dark SVG animations
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Hari-Milan-Arora
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23FF4655&color_dots=%230B0B0F,%2322222B,%235A1E28,%23B52B3A,%23FF4655
            dist/github-contribution-grid-snake-dark.svg?color_snake=%23FF4655&color_dots=%230B0B0F,%2322222B,%235A1E28,%23B52B3A,%23FF4655

      - name: Publish SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
